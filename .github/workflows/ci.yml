name: Digital Marketing Hub CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Frontend - Install & Build
      run: |
        cd frontend
        npm install
        npm run build

    - name: Backend - Install & Compile
      run: |
        cd backend
        npm install
        npm run build

    - name: Backend - Run Server Check
      env:
        TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        JWT_SECRET: "test-secret-key-2026"
        PORT: 5000
      run: |
        cd backend
        # Start server in background
        npm run start &
        # Wait for it to start
        sleep 5
        # Check if it responds
        curl --fail http://localhost:5000/ || exit 1
        echo "✅ API is running and reachable"
