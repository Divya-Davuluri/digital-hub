name: Digital Marketing Hub CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Frontend - Install & Build
      working-directory: ./frontend
      run: |
        npm ci
        npm run build

    - name: Backend - Install & Compile
      run: |
        cd backend
        npm install
        npm run build

    - name: Backend - Run Server Check
      env:
        TURSO_DATABASE_URL: "libsql://dummy.url"
        TURSO_AUTH_TOKEN: "dummy-token"
        JWT_SECRET: "test-secret-key-2026"
        REFRESH_SECRET: "test-refresh-key-2026"
        SESSION_SECRET: "test-session-secret"
        PORT: 5000
        CI: "true"
      run: |
        cd backend
        # Start server in background
        npm run start &
        # Wait for it to start
        sleep 5
        # Check if it responds
        curl --fail http://localhost:5000/ || exit 1
        echo "✅ API is running and reachable"
